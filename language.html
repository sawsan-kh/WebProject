<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/1cf483120b.js" crossorigin="anonymous"></script>
  <title>Language</title>
  <style>
    @import url('https://fonts.googleapis.com/css?family=Raleway:400,700');
   * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }

    .register-container {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 40px;
    border-radius: 10px;
    box-shadow:0 7px 20px black;
    position: relative;
    overflow: hidden;
    }

    .background-design {
      position: absolute;
      top: 0;
      right: 0;
      width: 300%;
      height: 150%;
      background: linear-gradient(135deg, #ffd700, #fff700);
      clip-path: polygon(100% 0, 0 0, 100% 100%);
      z-index: 1;
    }
   

    .screen__background { 
      background: linear-gradient(135deg, #ffff2f, #f2ed57);  
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      -webkit-clip-path: inset(0 0 0 0);
      clip-path: inset(0 0 0 0);  
      
    }

    .screen__background__shape {
      transform: rotate(45deg);
      position: absolute;
    }

    .screen__background__shape1 {
      height: 620px;
      width: 720px;
      background: #FFF; 
      top: -20px;
      right: 120px; 
      border-radius: 0 72px 0 0;
    }

    .screen__background__shape2 {
      height: 220px;
      width: 220px;
      background: #ffea02;  
      top: -132px;
      right: 35px; 
      border-radius: 32px;
    }

    .screen__background__shape3 {
      height: 540px;
      width: 220px;
      background: linear-gradient(270deg, #ffff2f, #ffea02);
      top: 35px;
      right: 0; 
      border-radius: 32px;
    }

    .screen__background__shape4 {
      height: 400px;
      width: 200px;
      background: #ffff2f;  
      top: 420px;
      right: 50px;  
      border-radius: 60px;
    }

    .choice {
      width: 320px;
      padding-bottom: 50px;
      padding-top: 50px;
      padding-left: 19px;
    }

    

    .button_ar , .button_fr {
      width: 100%;
      padding: 12px;
      background: #ffff2f;
      border: 2px solid #ffff2f;
      border-radius: 25px;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      z-index: 3;
      position: relative;
    }

    

    .no-underline {
        text-decoration: none;
        color: inherit;
    }

  </style>
</head>

<body>
  <section>
    <div class="register-container">
        <div class="screen">
            <div class="screen__content">
                <form class="choice">
                    
                      <button type="button" class="button_fr" onclick="window.location.href='LOG IN PAGE.HTML'">
                        <span class="button__text">Français </span>
                        <i class="button__icon fas fa-chevron-right"></i>
                      </button>
                    
                    
                      <button type="button" class="button_ar" onclick="window.location.href='LOG IN PAGE AR.HTML'">
                        <span class="button__text">العربية</span>
                        <i class="button__icon fas fa-chevron-right"></i>
                      </button>
                    
                </form>
            </div>
            <div class="screen__background">
                <span class="screen__background__shape screen__background__shape4"></span>
                 <span class="screen__background__shape screen__background__shape3"></span>
                 <span class="screen__background__shape screen__background__shape2"></span>
                 <span class="screen__background__shape screen__background__shape1"></span>
            </div>
        </div>
    </div>

    <script>
     

          
       
  </script>
</body>

</html>
